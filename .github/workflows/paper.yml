name: Paper

# Only when the report changes: installing a TeX toolchain is slower than the whole test matrix, and the paper
# cannot be broken by a change that does not touch it.
on:
  push:
    branches: [ "master" ]
    paths: [ "paper/**", ".github/workflows/paper.yml" ]
  pull_request:
    branches: [ "master" ]
    paths: [ "paper/**", ".github/workflows/paper.yml" ]

jobs:
  build-paper:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install a LaTeX toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra latexmk

      # latexmk resolves the bibliography and reruns until references settle; -halt-on-error stops at the first
      # TeX error, and -Werror additionally fails the build on an undefined citation or reference, which latexmk
      # evaluates after the final resolving pass rather than on an intermediate one.
      - name: Build the reports
        run: make -C paper

      - name: Upload the split-points report
        uses: actions/upload-artifact@v4
        with:
          name: split-points
          path: paper/split-points/split-points.pdf

      - name: Upload the split-windows report
        uses: actions/upload-artifact@v4
        with:
          name: split-windows
          path: paper/split-windows/split-windows.pdf
