name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  format-check:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          # Pinned to the major version the tree is formatted with; formatting output differs across majors.
          sudo apt-get install -y clang-format-19

      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format-19 --dry-run --Werror

  doc-commit-check:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        # Full history and tags: the check resolves the commits the documentation cites, and a shallow clone has
        # neither. This is the check that a force push has not left a published figure pointing at nothing.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the commits the documentation names
        run: tools/check_doc_commits.sh

  build-and-test-clang:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # Clang 18, the distribution default, still reports __cpp_concepts as 201907L, which libstdc++'s
          # <expected> requires at 202002L; Clang 19 is the first version that can compile the tokenizer.
          sudo apt-get install -y clang-19 ninja-build

      - name: Check Clang version
        run: clang++-19 --version

      - name: Configure build with CMake
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

  build-and-test-arm:
    runs-on: ubuntu-24.04-arm

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure build with CMake
        # Plain char is unsigned on this architecture, the opposite of the x86-64 jobs, so this build exercises
        # the byte-carrier convention live: symbols are stored as char and given meaning only through unsigned
        # char at every use site, and nothing anywhere may depend on the carrier's signedness.
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release -DMUNCH_BUILD_BENCHMARK=OFF

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

  # No macOS job: it requires an Apple toolchain whose libc++ ships std::jthread, which none does, Xcode 26
  # included, and the parallel scan keeps jthread rather than take platform conditionals. The mdspan
  # bracket-operator definition such a job also needs is already unconditional in external/mdspan/CMakeLists.txt.

  cmake-floor:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install the exact declared CMake minimum
        # The floor is only honest while something builds with it: 3.20.0 through 3.20.2 lack the GNU mapping
        # for cxx_std_23, and newer FetchContent keywords silently misparse on old CMake, so this job configures,
        # builds, and tests with precisely the version cmake_minimum_required() declares.
        run: |
          curl -sLO https://github.com/Kitware/CMake/releases/download/v3.20.6/cmake-3.20.6-linux-x86_64.tar.gz
          tar xzf cmake-3.20.6-linux-x86_64.tar.gz
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure build with CMake
        run: |
          mkdir build
          cd build
          ../cmake-3.20.6-linux-x86_64/bin/cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release \
                -DMUNCH_BUILD_BENCHMARK=OFF
      - name: Build with CMake
        run: |
          cd build
          ../cmake-3.20.6-linux-x86_64/bin/cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ../cmake-3.20.6-linux-x86_64/bin/ctest --output-on-failure

      - name: Check every declared minimum matches the version this job tests
        # Without this coupling the job proves only that 3.20.6 works, not that the tree declares it: a
        # CMakeLists declaring an older floor would pass here while promising consumers a version that fails.
        # Line-anchored so only real declarations count, case-insensitive because CMake commands are, the
        # install-consumer fixture is included, and the declaration count is pinned like the gate's figures so
        # a silent deletion fails rather than passes.
        run: |
          pattern='^[[:space:]]*cmake_minimum_required\('
          exact='^[[:space:]]*cmake_minimum_required\(VERSION 3\.20\.6\)[[:space:]]*$'
          declared=$(git grep -hiE "$pattern" -- '*CMakeLists.txt' '.github/workflows' | wc -l)
          if [ "$declared" != "15" ]; then
            echo "expected 15 cmake_minimum_required declarations, found $declared"
            exit 1
          fi
          if git grep -hiE "$pattern" -- '*CMakeLists.txt' '.github/workflows' | grep -ivE "$exact"; then
            echo "a declaration is not exactly the minimum this job tests"
            exit 1
          fi

  sanitize:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # Address and undefined-behavior sanitizers watch the table arithmetic; the thread sanitizer watches
          # the parallel scan.
          - name: address-undefined
            flags: -fsanitize=address,undefined -fno-sanitize-recover=all
          - name: thread
            flags: -fsanitize=thread

    name: sanitize (${{ matrix.name }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build

      - name: Configure build with CMake
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="${{ matrix.flags }}" \
                -DMUNCH_BUILD_BENCHMARK=OFF

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

  fuzz:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 ninja-build

      - name: Configure build with CMake
        env:
          CC: clang-19
          CXX: clang++-19
        run: |
          mkdir build
          cd build
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Release -DMUNCH_BUILD_FUZZER=ON \
                -DMUNCH_BUILD_TESTS=OFF -DMUNCH_BUILD_BENCHMARK=OFF

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      # A bounded smoke run each push; crashes and invariant violations reproduce from the printed input.
      - name: Fuzz the builder and scan invariants
        run: |
          mkdir corpus
          # print_new_funcs=0: symbolizing each newly covered function costs a symbolizer spawn per function and
          # adds nothing here; crash reports are still symbolized.
          ./build/tools/fuzz/munch_builder_fuzzer corpus -max_total_time=60 -timeout=10 -rss_limit_mb=4096 \
                -print_new_funcs=0

      # The raw string scanner is the one hand-written pointer walk over untrusted input in the tree, so it gets its
      # own target rather than sharing the builder's corpus, whose inputs decode as grammars and not as literals.
      - name: Fuzz the raw string scanner
        run: |
          mkdir raw-string-corpus
          ./build/tools/fuzz/munch_raw_string_fuzzer raw-string-corpus -max_total_time=60 -timeout=10 \
                -rss_limit_mb=4096 -print_new_funcs=0

  xid-data:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch the pinned Unicode database
        run: |
          curl -sSf -o DerivedCoreProperties.txt \
                https://www.unicode.org/Public/17.0.0/ucd/DerivedCoreProperties.txt
          echo "24c7fed1195c482faaefd5c1e7eb821c5ee1fb6de07ecdbaa64b56a99da22c08  DerivedCoreProperties.txt" \
                | sha256sum -c -

      - name: Regenerate the XID tables
        run: python3 tools/unicode/generate_xid.py DerivedCoreProperties.txt

      # The checked-in tables must be exactly what the pinned database generates.
      - name: Verify the checked-in tables match
        run: git diff --exit-code libs/regex/src/xid_ranges.inc

  install-consumer:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build and install munch
        run: |
          cmake -G Ninja -S . -B build -DCMAKE_BUILD_TYPE=Release -DMUNCH_BUILD_TESTS=OFF \
                -DMUNCH_BUILD_BENCHMARK=OFF
          cmake --build build
          cmake --install build --prefix "$PWD/prefix"

      # The consumer lives outside the source tree and sees only the installed package, which is what proves the
      # export set, the config files, and header self-containment.
      - name: Compile and run a consumer of the installed package
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20.6)
          project(consumer CXX)

          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          find_package(munch CONFIG REQUIRED)

          add_executable(consumer main.cpp)

          target_link_libraries(consumer PRIVATE munch::munch)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <cstddef>
          #include <string>

          #include <munch/core/builder.hpp>
          #include <munch/regex/regex.hpp>
          #include <munch/regex/set.hpp>
          #include <munch/regex/unicode.hpp>

          int main()
          {
              using namespace munch::regex;

              enum class Token : std::size_t
              {
                  Word,
                  Space,
              };

              munch::core::Builder builder;

              builder.add_token(concat(unicode::xid_start(), kleene(unicode::xid_continue())), Token::Word, 1);
              builder.add_token(plus(any_of(Set{' '})), Token::Space, 1);

              const auto lexer{builder.build()};

              const std::string input{"hello \xCE\xBB world"};

              std::size_t count{0};

              const auto consumed{lexer.tokenize_all<Token>(input, [&count](Token, std::size_t) { ++count; })};

              return consumed == input.size() && count == 5 ? 0 : 1;
          }
          EOF
          cmake -G Ninja -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build consumer/build
          ./consumer/build/consumer

  build-and-test:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Print OS details
        run: |
          uname -a
          lsb_release -a

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr ninja-build

      - name: Check GCC and gcovr version
        run: |
          g++ --version
          gcov --version
          gcovr --version

      - name: Configure build with CMake
        env:
          CC: gcc
          CXX: g++
        run: |
          mkdir build
          cd build
          # tokenize_all_parallel() runs the scan on several threads, and gcov's counters are not atomic by
          # default, so concurrent updates corrupt them into negative branch counts (GCC bug 68080).
          cmake -G Ninja .. -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="--coverage -fprofile-abs-path -fprofile-update=atomic" \
                -DMUNCH_BUILD_BENCHMARK=OFF

      - name: Build with CMake
        run: |
          cd build
          cmake --build .

      - name: Run tests with CTest
        run: |
          cd build
          ctest --output-on-failure

      - name: Generate code coverage report
        run: |
          cd build

          # Each pattern is unanchored on both ends: gcovr matches --exclude against a path that may or may not
          # have a leading directory component (e.g. "_deps/..." from one root, "build/_deps/..." from another),
          # so a pattern requiring a literal leading "/" silently fails to match the no-prefix case.
          EXCLUDES=(
            --exclude '(.*/)?external/.*'
            --exclude '(.*/)?_deps/.*'
            --exclude '(.*/)?tests/.*'
            --exclude '(.*/)?tools/benchmark/.*'
            --exclude '(.*/)?tools/probes/.*'
            --exclude '(.*/)?CMakeFiles/.*'
          )

          gcovr --root .. --gcov-executable gcov --xml-pretty --output coverage.xml "${EXCLUDES[@]}"
          gcovr --root .. --gcov-executable gcov --html --html-details --output coverage.html "${EXCLUDES[@]}"
          gcovr --root .. --gcov-executable gcov --txt-metric branch --print-summary "${EXCLUDES[@]}"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: build/coverage.xml
          flags: unittests
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
